<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gym Library</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gym Library">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EEF0EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121514" media="(prefers-color-scheme: dark)">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: one-column phone app; sticky header with search + segmented tabs; cards listed below */
:root{
  --bg:#EEF0EE; --surface:#FFFFFF; --ink:#171A19; --muted:#5E6663; --line:#D5DAD7;
  --accent:#B57F00; --accent-ink:#171A19; --accent-soft:#F6E7BF; --chip:#E3E7E4;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121514; --surface:#1B1F1E; --ink:#ECEFED; --muted:#9AA39F; --line:#2C3230;
  --accent:#F2B92B; --accent-ink:#121514; --accent-soft:#3A3115; --chip:#262B29; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121514; --surface:#1B1F1E; --ink:#ECEFED; --muted:#9AA39F; --line:#2C3230;
  --accent:#F2B92B; --accent-ink:#121514; --accent-soft:#3A3115; --chip:#262B29; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:grid;gap:10px;border-bottom:1px solid var(--line)}
h1{font-family:var(--display);font-weight:700;font-size:28px;letter-spacing:.02em;text-transform:uppercase;margin:0;line-height:1;display:flex;align-items:baseline;gap:8px}
h1 small{font-family:var(--body);font-size:13px;font-weight:500;color:var(--muted);text-transform:none;letter-spacing:0}
#q{width:100%;font:inherit;font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
#q:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--chip);border-radius:10px;padding:3px;gap:3px}
.tabs button{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:0;border:0;background:transparent;color:var(--muted);padding:8px 1px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-radius:8px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.filters{display:flex;gap:6px;overflow-x:auto;padding-block:12px 4px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex:none;font:inherit;font-size:14px;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:5px 11px;border-radius:999px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.list{display:grid;gap:10px;margin-top:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.card h2{font-family:var(--display);font-weight:700;font-size:22px;margin:0;line-height:1.1;text-wrap:balance}
.meta{color:var(--muted);font-size:14px;margin-top:2px}
.rx{display:inline-flex;gap:8px;align-items:baseline;margin-top:10px;font-variant-numeric:tabular-nums}
.rx b{font-family:var(--display);font-size:20px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.tag{font-size:12.5px;background:var(--chip);color:var(--ink);padding:3px 8px;border-radius:6px}
.note{font-size:14px;color:var(--muted);margin-top:8px}
.note strong{color:var(--ink);font-weight:600}
.wid{font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.06em;background:var(--accent-soft);color:var(--ink);padding:2px 7px;border-radius:5px}
details>summary{list-style:none;cursor:pointer}
details>summary::-webkit-details-marker{display:none}
.wh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.chev{font-family:var(--display);color:var(--muted);font-size:20px;transition:transform .15s}
details[open] .chev{transform:rotate(90deg)}
.steps{list-style:none;margin:12px 0 0;padding:0;display:grid}
.steps li{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:baseline;padding:9px 0;border-top:1px solid var(--line)}
.steps .n{font-family:var(--display);font-weight:700;color:var(--accent);font-size:18px}
.dark-acc .steps .n{color:var(--accent)}
.steps .x{font-weight:600}
.steps .r{text-align:right;font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted);max-width:52vw}
.steps .r b{color:var(--ink);font-weight:600}
.sec{margin-top:14px}
.sec h3{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.cues{margin:0;padding-left:20px;display:grid;gap:6px}
.cues li::marker{color:var(--accent)}
.empty{color:var(--muted);text-align:center;padding:32px 0}
.count{font-size:13px;color:var(--muted);margin-top:8px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.refresh{flex:none;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:22px;line-height:1;cursor:pointer}
.refresh.spin{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ptr{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 6px);z-index:20;transform:translate(-50%,-60px);display:flex;align-items:center;gap:8px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:500;box-shadow:0 2px 10px rgba(0,0,0,.12);opacity:0;pointer-events:none}
.ptr-i{display:inline-block;font-size:16px;transition:transform .15s}
.ptr.ready .ptr-i{transform:rotate(180deg)}
.ptr.busy .ptr-i{animation:spin .8s linear infinite}
.ptr.anim{transition:transform .2s,opacity .2s}
.logform{margin-top:12px;display:grid;gap:10px}
.logform h2{font-size:20px}
.field{display:grid;gap:4px;min-width:0}
.field label{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.field input{width:100%;min-width:0;font:inherit;font-size:16px;padding:9px 10px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.lf-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end}
.bw{display:flex;gap:8px;align-items:center;font-weight:600;font-size:15px;line-height:1.15;padding-bottom:8px}
.bw span{font-weight:400;font-size:12.5px;color:var(--muted)}
.bw input{width:20px;height:20px;accent-color:var(--accent)}
.primary{font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.05em;text-transform:uppercase;border:0;border-radius:10px;padding:11px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.lf-msg{font-size:14px;color:var(--muted);min-height:1.2em}
.lf-msg.err{color:#C0392B}
.ghost{font:inherit;font-size:14px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 12px;border-radius:9px;cursor:pointer}
.lift-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;padding:0;color:inherit;font:inherit;cursor:pointer}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.seg .chip{font-size:13px;padding:4px 10px}
.big{display:flex;align-items:baseline;gap:10px;margin-top:12px;flex-wrap:wrap}
.big b{font-family:var(--display);font-size:32px;line-height:1;font-variant-numeric:tabular-nums}
.delta{font-size:14px;font-weight:600}
.up{color:#2E8B57}.down{color:#C0392B}
.chart{width:100%;height:auto;display:block;margin-top:8px}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:var(--accent);opacity:.14}
.chart .pt{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.chart .pt.last{fill:var(--accent)}
.chart .ln2{fill:none;stroke:var(--muted);stroke-width:2;stroke-dasharray:5 4}
.chart .pt2{fill:var(--muted)}
.chart .refl{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:2 4}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:4px}
.legend i{display:inline-block;width:18px;height:0;border-top:3px solid var(--accent);vertical-align:middle;margin-right:5px}
.legend i.d{border-top:2px dashed var(--muted)}
.legend i.r{border-top:2px dotted var(--muted)}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--body)}
.sess{margin-top:12px;display:grid}
.sess>div{padding:9px 0;border-top:1px solid var(--line)}
.sess .d{font-size:13px;font-weight:600;color:var(--muted)}
.sets{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
.set{display:inline-flex;align-items:center;gap:6px;background:var(--chip);border-radius:7px;padding:3px 4px 3px 9px;font-size:14px;font-variant-numeric:tabular-nums}
.set button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:13px;padding:2px 6px;border-radius:5px;cursor:pointer}
.set button[data-armed]{background:#C0392B;color:#fff}
.backup{display:grid;gap:10px}
.bwcard{display:grid;gap:10px}
.bwrow{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}
.bwrow .ghost{padding:9px 12px}
.rank{margin-top:12px;padding:12px;border-radius:10px;background:var(--bg);border:1px solid var(--line);display:grid;gap:8px}
.rank-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.tier{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:6px;background:var(--accent);color:var(--accent-ink)}
.tier.sm{font-size:12px;padding:1px 6px;margin-left:6px;vertical-align:2px}
.bar{height:8px;border-radius:99px;background:var(--chip);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.ladder{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;font-size:11.5px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.ladder span.on{color:var(--ink);font-weight:700}
.backup p{margin:0;font-size:14px;color:var(--muted)}
.backup .row{display:flex;gap:8px;flex-wrap:wrap}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .up{color:#5CC98A}:root:not([data-theme="light"]) .down,:root:not([data-theme="light"]) .lf-msg.err{color:#F0857A}}
:root[data-theme="dark"] .up{color:#5CC98A}:root[data-theme="dark"] .down,:root[data-theme="dark"] .lf-msg.err{color:#F0857A}
.sessbox{display:grid;gap:10px;margin-top:12px}
.sesscard{display:grid;gap:0}
.timer{font-family:var(--display);font-weight:700;font-size:22px;font-variant-numeric:tabular-nums}
.live{display:inline-block;font-family:var(--body);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:#C0392B;color:#fff;border-radius:5px;padding:2px 6px;vertical-align:4px;margin-left:6px}
.sx{border-top:1px solid var(--line);padding-top:12px;margin-top:12px;display:grid;gap:8px;min-width:0}
.sx-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sx-h b{font-family:var(--display);font-size:20px;line-height:1.1;min-width:0}
.sx-tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.sx-tools select{font:inherit;font-size:13px;padding:3px 6px;border-radius:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.sx-tools label{display:inline-flex;gap:5px;align-items:center}
.sx-tools input{width:16px;height:16px;accent-color:var(--accent)}
.linkbtn{border:0;background:none;color:var(--muted);font:inherit;font-size:13px;text-decoration:underline;padding:0;cursor:pointer}
.linkbtn[data-armed]{color:#C0392B;font-weight:600}
.hint{font-size:13px;color:var(--muted)}
.addrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:8px}
.addrow input,.plain{width:100%;min-width:0;font:inherit;font-size:16px;padding:8px 10px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.addrow input:disabled{opacity:.55}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.addex{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;min-width:0}
.stat b{display:block;font-family:var(--display);font-size:26px;line-height:1.05;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted)}
.bp{display:grid;gap:10px;margin-top:4px}
.bp-r{display:grid;gap:4px}
.bp-t{display:flex;justify-content:space-between;gap:8px;font-size:14px;font-variant-numeric:tabular-nums}
.bp-t b{font-weight:600}
.planchips{display:flex;flex-wrap:wrap;gap:6px}
.planchips .chip{white-space:normal;text-align:left}
.brow{display:grid;grid-template-columns:minmax(0,1fr) 56px 76px auto;gap:6px;align-items:center}
.brow input{width:100%;min-width:0;font:inherit;font-size:16px;padding:7px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.startbtn{margin-top:12px;width:100%}
.ctag{font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-left:6px}
.subtabs{display:grid;width:max-content;max-width:100%;grid-auto-flow:column;gap:3px;background:var(--chip);border-radius:9px;padding:3px;margin-top:12px}
.subtabs button{font:inherit;font-size:14px;font-weight:600;border:0;background:transparent;color:var(--muted);padding:5px 12px;border-radius:7px;cursor:pointer}
.subtabs button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.closed{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.closed b{font-family:var(--display);font-size:18px}
.closed .hint{margin-top:2px}
.cf{display:grid;gap:10px}
.cf3{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr) minmax(0,1fr);gap:8px;align-items:end}
.tpair{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.tpair input{padding-left:6px;padding-right:6px}
.cf select,.cf textarea{width:100%;min-width:0;font:inherit;font-size:16px;padding:8px 10px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.cf textarea{min-height:64px;resize:vertical}
.crow{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}
.crow .x{font-weight:600}
.cnote{font-size:13.5px;color:var(--muted);margin-top:3px;white-space:pre-wrap}
.qa{display:grid;gap:8px;margin-top:4px}
.qrow{display:grid;gap:2px;padding:8px 0;border-top:1px solid var(--line)}
.qrow:first-child{border-top:0}
.qtop{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.qtop b{font-weight:600}
.pill{font-size:12px;font-weight:700;border-radius:999px;padding:2px 8px;white-space:nowrap;background:var(--chip);color:var(--ink)}
.pill.good{background:#2E8B57;color:#fff}.pill.bad{background:#C0392B;color:#fff}.pill.best{background:var(--accent);color:var(--accent-ink)}
.cmp{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;font-size:14px;font-variant-numeric:tabular-nums;margin-top:4px}
.cmp span:nth-child(3n+1){color:var(--muted)}
.cmp span:nth-child(3n){text-align:right;font-weight:600}
.ideas{margin:4px 0 0;padding-left:20px;display:grid;gap:6px}
.ideas li::marker{color:var(--accent)}
.liftsub{margin-top:12px;width:100%!important;grid-template-columns:1fr 1fr}
.liftsub button{font-family:var(--display);font-size:16px;letter-spacing:.04em;text-transform:uppercase;padding:7px}
.chip{min-height:34px}
.linkbtn{padding:6px 0}
.set button{min-width:30px;min-height:30px}
.setb{font:inherit;font-size:14.5px;font-variant-numeric:tabular-nums;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:8px;padding:6px 10px;min-height:38px;cursor:pointer}
.setb.wu{background:transparent;color:var(--muted);border-style:dashed}
.setb.on{outline:2px solid var(--accent);outline-offset:1px}
.setb .k{font-weight:700;margin-right:4px;color:var(--accent)}
.setb.wu .k{color:var(--muted)}
.set.wu{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.edrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 70px;gap:8px;align-items:end;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px}
.edrow .acts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.addrow.r4{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 64px auto}
.addrow select,.edrow select{width:100%;min-width:0;font:inherit;font-size:16px;padding:8px 4px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.restbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--ink);color:var(--bg);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-shadow:0 -4px 16px rgba(0,0,0,.2)}
.restbar .hint{color:inherit;opacity:.7;display:block}
.restbar b{font-family:var(--display);font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.restbar.done{background:var(--accent);color:var(--accent-ink)}
.rb-l{min-width:0}
.rb-l .hint{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}
.rb-b{display:flex;gap:6px}
.rb-b button{font:inherit;font-size:14px;font-weight:600;border:1px solid currentColor;background:transparent;color:inherit;border-radius:9px;padding:8px 10px;min-height:40px;cursor:pointer}
body.resting .wrap{padding-bottom:96px}
.banner{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--accent-soft);border:1px solid var(--accent);border-radius:12px;padding:12px}
.banner b{display:block}
.wk{display:grid;gap:9px;margin-top:8px}
.wk-r{display:grid;gap:4px}
.wk-bar{position:relative;height:10px;border-radius:99px;background:var(--chip);overflow:hidden}
.wk-bar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--muted)}
.wk-bar i.ok{background:var(--accent)}
.wk-bar u{position:absolute;top:0;bottom:0;width:2px;background:var(--surface);opacity:.9}
.cal{display:grid;grid-template-columns:auto repeat(7,minmax(0,1fr));gap:4px;align-items:center;margin-top:8px;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.cal i{display:block;height:16px;border-radius:4px;background:var(--chip)}
.cal i.l{background:var(--accent)}
.cal i.c{background:#3A8FB7}
.cal i.lc{background:linear-gradient(135deg,var(--accent) 50%,#3A8FB7 50%)}
.cal i.f{opacity:.35}

  let done = false;
  try { const f = new File([blob], name, {type:"application/json"}); if (navigator.canShare?.({files:[f]})) { await navigator.share({files:[f], title:name}); done = true; } } catch(err) { if (err?.name === "AbortError") return; }
  if (!done) { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000); }
  store.set("lastExport", iso(new Date())); render(); setTimeout(() => { const m = document.getElementById("bk-msg"); if (m) m.textContent = `Exported ${log.length} sets.`; }, 0);
}

function wuFlags(sets){

function chartSVG(pts, unit, small, opt){
  opt = opt || {};
  const W = 340, H = small ? 96 : 170, L = 42, R = 14, T = 10, B = 22;
  if (!pts.length) return "";
  const xs = pts.map(p => new Date(p.d + "T00:00").getTime()), ys = pts.map(p => p.v).concat((opt.second || []).map(p => p.v), opt.ref ? [opt.ref.v] : []);
  let y0 = Math.min(...ys), y1 = Math.max(...ys);
  if (y0 === y1) { y0 = y0 * 0.9; y1 = y1 * 1.1 || 1; } else { const pad = (y1 - y0) * 0.15; y0 -= pad; y1 += pad; }
  if (y0 < 0) y0 = 0;
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  const X = t => x1 === x0 ? (L + W - R) / 2 : L + (t - x0) / (x1 - x0) * (W - L - R);
  const Y = v => opt.invert ? T + (v - y0) / (y1 - y0) * (H - T - B) : T + (1 - (v - y0) / (y1 - y0)) * (H - T - B);
  const ticks = (small ? [0, 1] : [0, 0.5, 1]).map(f => y0 + f * (y1 - y0));
  const P = pts.map((p, i) => [X(xs[i]), Y(p.v)]);
  const line = P.map(p => p.map(n => n.toFixed(1)).join(",")).join(" ");
  const P2 = (opt.second || []).map(p => [X(new Date(p.d + "T00:00").getTime()), Y(p.v)]);
  const ln2 = P2.length ? `${P2.length > 1 ? `<polyline class="ln2" points="${P2.map(p => p.map(n => n.toFixed(1)).join(",")).join(" ")}"/>` : ""}${P2.map(p => `<circle class="pt2" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3"/>`).join("")}` : "";
  const refl = opt.ref ? `<line class="refl" x1="${L}" x2="${W-R}" y1="${Y(opt.ref.v).toFixed(1)}" y2="${Y(opt.ref.v).toFixed(1)}"/><text x="${W-R}" y="${(Y(opt.ref.v)-4).toFixed(1)}" text-anchor="end">${esc(opt.ref.label)}</text>` : "";
  const area = P.length > 1 && !opt.invert ? `<polygon class="ar" points="${P[0][0].toFixed(1)},${H-B} ${line} ${P[P.length-1][0].toFixed(1)},${H-B}"/>` : "";
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Progress chart">

function dupGroups(){

  pool.forEach(n => { const D = dbOf(n); const key = D ? "db:" + D.name : "k:" + keysOf(n)[0]; if (!groups.has(key)) groups.set(key, {canon: D ? D.name : null, names: []}); groups.get(key).names.push(n); });

const COACH = (() => {
// ===== Gym Coach analysis engine (pure functions, no DOM) =====
const ENGINE_VERSION = 1;

const GROUPS = {
  chest:{label:'Chest',target:10}, back:{label:'Back',target:10}, shoulders:{label:'Shoulders',target:8},
  biceps:{label:'Biceps',target:6}, triceps:{label:'Triceps',target:6}, quads:{label:'Quads',target:10},
  hamstrings:{label:'Hamstrings',target:8}, glutes:{label:'Glutes',target:0}, core:{label:'Core',target:4},
  traps:{label:'Traps',target:0}, calves:{label:'Calves',target:0}, power:{label:'Power',target:0}

const PUSH = ['chest','shoulders','triceps'], PULL = ['back','biceps'], LOWER = ['quads','hamstrings'];

function muscleMap(name, body) {
  const n = name.toLowerCase();
  const has = (...k) => k.some(x => n.includes(x));
  if (has('leg curl','hamstring curl','nordic')) return {hamstrings:1};
  if (has('leg extension')) return {quads:1};
  if (has('calf')) return {calves:1};
  if (has('romanian','rdl','stiff','good morning')) return {hamstrings:1, glutes:.5};
  if (has('deadlift')) return {hamstrings:.5, glutes:.5, back:.5, quads:.5};
  if (has('hip thrust','glute')) return {glutes:1, hamstrings:.5};
  if (has('squat','leg press','lunge','split','step up','hack')) return {quads:1, glutes:.5};
  if (has('clean','snatch','jerk','jump','throw','slam')) return {power:1};
  if (has('carry')) return {core:.5, traps:.5};
  if (has('crunch','plank','ab ','abs','sit up','sit-up','leg raise','rollout','pallof','core')) return {core:1};
  if (has('shrug')) return {traps:1};
  if (has('upright row')) return {shoulders:1, traps:.5};
  if (has('lateral raise','rear delt','face pull','reverse fly')) return {shoulders:1};
  if (has('overhead','shoulder press','military','arnold','push press')) return {shoulders:1, triceps:.5};
  if (has('pulldown','pull up','pull-up','pullup','chin')) return {back:1, biceps:.5};
  if (has('row')) return {back:1, biceps:.5};
  if (has('curl')) return {biceps:1};
  if (has('pushdown','tricep','skull','dip','kickback','french press')) return {triceps:1};
  if (has('bench','chest','supine','incline','decline','fly','flye','push up','push-up','pec')) return {chest:1, triceps:.5, shoulders:.5};
  const b = (body||'').toLowerCase();
  if (b === 'legs') return {quads:.5, hamstrings:.5};
  if (b === 'chest') return {chest:1};
  if (b === 'back') return {back:1};
  if (b === 'shoulders') return {shoulders:1};
  if (b === 'arms') return {biceps:.5, triceps:.5};

}

const e1rm = (kg, reps) => (!kg || !reps) ? 0 : reps === 1 ? kg : kg * (1 + Math.min(reps, 15) / 30);

// ---- merge an export into the accumulated store ----
function mergeExport(store, exp) {
  store = store || {sets:{}, cardio:{}, bw:{}, sessions:{}, prior:{}, body:{}};
  let added = 0;
  for (const e of exp.log || []) {
    if (!e.id || !e.ex || !e.date) continue;
    if (!store.sets[e.id]) added++;

function analyse(store, opts) {

    const allBest = Math.max(prevBest, last.best);
    let status = 'new', note = '';

  const parts = [consistency, progression, balance, conditioning].filter(x => x != null);

}

// ---- grade previous work-ons against the new data ----
function gradeWorkons(prevReport, store, A) {
  if (!prevReport || !prevReport.workons) return [];
  const since = prevReport.lastDate;
  const newSets = Object.values(store.sets).filter(s => s.d > since && s.d <= A.nowDate);
  const newDays = [...new Set(newSets.filter(s => !s.wu).map(s => s.d))];
  const spanDays = Math.max(1, dayNum(A.nowDate) - dayNum(since));
  return prevReport.workons.map(w => {
    const c = w.check || {}; let result = 'pending', detail = '';
    if (!newDays.length) return {...w, result: 'pending', detail: 'No training logged since that update.'};
    if (c.type === 'beat') {
      const list = newSets.filter(s => s.ex === c.ex && !s.wu && s.r > 0);
      if (!list.length) { result = 'missed'; detail = `${c.ex} wasn't trained.`; }
      else {

        result = best >= c.value * (c.strict ? 1.002 : 1) ? 'hit' : 'missed';
        detail = `Best since: ${r1(best)}${c.bw ? ' reps' : 'kg e1RM'} vs target ${c.strict ? '>' : '≥'} ${c.value}${c.bw ? '' : 'kg'}.`;

      for (const h of A._hard) if (h.d > since && h.d <= A.nowDate) v += (muscleMap(h.ex, A._body[h.ex])[c.group] || 0);
      const rate = r1(v / Math.max(7, spanDays) * 7);

      detail = `${GROUPS[c.group].label}: ${r1(v)} hard sets in ${spanDays} days (≈${rate}/wk, target ${c.target}).`;
    } else if (c.type === 'sessions') {
      const rate = r1(newDays.length / spanDays * 7);
      result = spanDays < 5 ? 'pending' : rate >= c.target ? 'hit' : 'missed';
      detail = `${newDays.length} sessions in ${spanDays} days (≈${rate}/wk, target ${c.target}).`;
    } else if (c.type === 'cardio') {
      const n = Object.values(store.cardio).filter(x => x.d > since && x.d <= A.nowDate).length;
      result = n >= c.target ? 'hit' : spanDays < 6 ? 'pending' : 'missed';
      detail = `${n} conditioning pieces logged (target ${c.target}).`;
    } else if (c.type === 'bw') {
      const n = Object.values(store.bw).filter(x => x.d > since).length;
      result = n ? 'hit' : 'missed'; detail = n ? `${n} bodyweight log(s).` : 'No bodyweight logged.';
    } else if (c.type === 'train') {
      const n = new Set(newSets.filter(s => s.ex === c.ex && !s.wu).map(s => s.d)).size;
      result = n >= c.target ? 'hit' : spanDays < 6 ? 'pending' : 'missed';
      detail = `${c.ex}: ${n} session(s) (target ${c.target}).`;
    }
    return {...w, result, detail};
  });
}

    const has = n => log.some(l => l.ex === n) || wsess.some(r => r.items.some(i => i.ex === n)) || plans.some(p => p.items.some(i => i.ex === n));
    M.forEach(([f, t]) => { if (has(f)) renameExercise(f, t); });
    /* curls logged before per-hand existed: entered per hand, so double their volume */
    log.forEach(l => { if (l.ex === "Dumbbell Curl" && !l.bw) l.ph = true; });
    wsess.forEach(r => r.items.forEach(it => { if (it.ex === "Dumbbell Curl") it.sets.forEach(x => { if (!x.bw) x.ph = true; }); }));
    phmap["dumbbell curl"] = true;
    if (!prmap["back squat"]) prmap["back squat"] = {kg: 140, reps: 1};
    saveLog(); wr(SKEY, wsess); wr(HKEY, phmap); savePrior();
    store.set("gl-mig-1", "1");
  } catch(e) {}
}
/* One-time fixes agreed 3 Nov 2026: supine press per hand, barbell curl was dumbbell curl, typo names, 24 Oct session left open. */
if (!FRIENDS && !store.get("gl-mig-2")) {
  try {
    const sp = wsess.find(r => r.id === "smvbwfqb5");
    log.forEach(l => { if (l.ex === "Supine press" && l.date === "2026-10-17" && !l.ph) { l.kg = l.kg / 2; l.ph = true; } });
    if (sp) sp.items.forEach(it => { if (it.ex === "Supine press") it.sets.forEach(x => { if (!x.ph) { x.kg = x.kg / 2; x.ph = true; } }); });
    phmap["supine press"] = true;
    [["Barbell Curl","Dumbbell Curl"],["Weighted cruches","Weighted Crunch"],["Incline Dumbell press","Incline Dumbbell Press"]].forEach(([f, t]) => {
      if (log.some(l => l.ex === f) || wsess.some(r => r.items.some(i => i.ex === f)) || plans.some(p => p.items.some(i => i.ex === f))) renameExercise(f, t); });
    log.forEach(l => { if (l.ex === "Dumbbell Curl" && !l.bw) l.ph = true; });
    wsess.forEach(r => r.items.forEach(it => { if (it.ex === "Dumbbell Curl") it.sets.forEach(x => { if (!x.bw) x.ph = true; }); }));
    wsess.forEach(r => { if (r.end - r.start > 4 * 3600e3) {
      r.items.forEach(it => { if ((it.dur || 0) > 3 * 3600e3) it.dur = Math.max(2, it.sets.length * 2) * 60e3; });
      r.end = r.start + Math.max(20 * 60e3, r.items.reduce((a, it) => a + (it.dur || 0), 0)); } });
    saveLog(); wr(SKEY, wsess); wr(HKEY, phmap);
    store.set("gl-mig-2", "1");
  } catch(e) {}
}
/* Carries logged before distance tracking: the reps box held metres. */
if (!store.get("gl-mig-3")) {
  try {
    const fix = x => { if (!x.carry && !x.bw && x.kg) { x.dist = x.reps; x.reps = 1; x.carry = true; } };
    log.forEach(l => { if (isCarry(l.ex)) fix(l); });
    wsess.forEach(r => r.items.forEach(it => { if (isCarry(it.ex)) it.sets.forEach(fix); }));
    if (active) active.items.forEach(it => { if (isCarry(it.ex)) { it.carry = true; it.bw = false; it.sets.forEach(fix); } });
    saveLog(); wr(SKEY, wsess); saveActive(); store.set("gl-mig-3", "1");
  } catch(e) {}
}
if (openToday && (active || dayPlan())) { tab = "lifts"; liftView = "train"; }
render();
async function doRefresh(){
  try { const r = await navigator.serviceWorker?.getRegistration(); await r?.update(); } catch(err) {}
  location.reload();
}
$("#refresh").addEventListener("click", e => { e.currentTarget.classList.add("spin"); doRefresh(); });

// Pull down from the top of the page to refresh
(() => {
  const el = $("#ptr"), txt = $("#ptr-t"), TH = 70;
  let sy = null, sx = 0, pull = 0, busy = false;
  const show = p => { el.style.transform = `translate(-50%, ${Math.min(p, 90) - 60}px)`; el.style.opacity = Math.min(1, p / 40); };
  addEventListener("touchstart", e => {
    if (busy || window.scrollY > 0 || e.touches.length > 1) { sy = null; return; }
    sy = e.touches[0].clientY; sx = e.touches[0].clientX; pull = 0; el.classList.remove("anim");
  }, { passive: true });
  addEventListener("touchmove", e => {
    if (sy === null) return;
    const dy = e.touches[0].clientY - sy, dx = Math.abs(e.touches[0].clientX - sx);
    if (dy <= 0 || dx > dy || window.scrollY > 0) { pull = 0; show(0); return; }
    pull = dy * 0.5; show(pull);
    const ready = pull >= TH; el.classList.toggle("ready", ready);
    txt.textContent = ready ? "Release to refresh" : "Pull to refresh";
  }, { passive: true });
  addEventListener("touchend", () => {
    if (sy === null) return; sy = null;
    el.classList.add("anim");
    if (pull >= TH) { busy = true; el.classList.remove("ready"); el.classList.add("busy"); txt.textContent = "Refreshing"; show(TH); doRefresh(); }
    else { show(0); el.classList.remove("ready"); }
    pull = 0;
  });
})();
</script>
