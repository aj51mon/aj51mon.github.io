<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gym Tracker</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gym Tracker">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EEF0EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121514" media="(prefers-color-scheme: dark)">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: one-column phone app; sticky header with search + segmented tabs; cards listed below */
:root{
  --bg:#EEF0EE; --surface:#FFFFFF; --ink:#171A19; --muted:#5E6663; --line:#D5DAD7;
  --accent:#B57F00; --accent-ink:#171A19; --accent-soft:#F6E7BF; --chip:#E3E7E4;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121514; --surface:#1B1F1E; --ink:#ECEFED; --muted:#9AA39F; --line:#2C3230;
  --accent:#F2B92B; --accent-ink:#121514; --accent-soft:#3A3115; --chip:#262B29; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121514; --surface:#1B1F1E; --ink:#ECEFED; --muted:#9AA39F; --line:#2C3230;
  --accent:#F2B92B; --accent-ink:#121514; --accent-soft:#3A3115; --chip:#262B29; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:grid;gap:10px;border-bottom:1px solid var(--line)}
h1{font-family:var(--display);font-weight:700;font-size:28px;letter-spacing:.02em;text-transform:uppercase;margin:0;line-height:1;display:flex;align-items:baseline;gap:8px}
h1 small{font-family:var(--body);font-size:13px;font-weight:500;color:var(--muted);text-transform:none;letter-spacing:0}
#q{width:100%;font:inherit;font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
#q:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--chip);border-radius:10px;padding:3px;gap:3px}
.tabs button{font-family:var(--display);font-weight:600;font-size:16px;letter-spacing:.01em;border:0;background:transparent;color:var(--muted);padding:8px 2px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-radius:8px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.filters{display:flex;gap:6px;overflow-x:auto;padding-block:12px 4px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex:none;font:inherit;font-size:14px;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:5px 11px;border-radius:999px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.list{display:grid;gap:10px;margin-top:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.card h2{font-family:var(--display);font-weight:700;font-size:22px;margin:0;line-height:1.1;text-wrap:balance}
.meta{color:var(--muted);font-size:14px;margin-top:2px}
.rx{display:inline-flex;gap:8px;align-items:baseline;margin-top:10px;font-variant-numeric:tabular-nums}
.rx b{font-family:var(--display);font-size:20px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.tag{font-size:12.5px;background:var(--chip);color:var(--ink);padding:3px 8px;border-radius:6px}
.note{font-size:14px;color:var(--muted);margin-top:8px}
.note strong{color:var(--ink);font-weight:600}
.wid{font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.06em;background:var(--accent-soft);color:var(--ink);padding:2px 7px;border-radius:5px}
details>summary{list-style:none;cursor:pointer}
details>summary::-webkit-details-marker{display:none}
.wh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.chev{font-family:var(--display);color:var(--muted);font-size:20px;transition:transform .15s}
details[open] .chev{transform:rotate(90deg)}
.steps{list-style:none;margin:12px 0 0;padding:0;display:grid}
.steps li{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:baseline;padding:9px 0;border-top:1px solid var(--line)}
.steps .n{font-family:var(--display);font-weight:700;color:var(--accent);font-size:18px}
.dark-acc .steps .n{color:var(--accent)}
.steps .x{font-weight:600}
.steps .r{text-align:right;font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted);max-width:52vw}
.steps .r b{color:var(--ink);font-weight:600}
.sec{margin-top:14px}
.sec h3{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.cues{margin:0;padding-left:20px;display:grid;gap:6px}
.cues li::marker{color:var(--accent)}
.empty{color:var(--muted);text-align:center;padding:32px 0}
.count{font-size:13px;color:var(--muted);margin-top:8px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.refresh{flex:none;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:22px;line-height:1;cursor:pointer}
.refresh.spin{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ptr{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 6px);z-index:20;transform:translate(-50%,-60px);display:flex;align-items:center;gap:8px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:500;box-shadow:0 2px 10px rgba(0,0,0,.12);opacity:0;pointer-events:none}
.ptr-i{display:inline-block;font-size:16px;transition:transform .15s}
.ptr.ready .ptr-i{transform:rotate(180deg)}
.ptr.busy .ptr-i{animation:spin .8s linear infinite}
.ptr.anim{transition:transform .2s,opacity .2s}
.logform{margin-top:12px;display:grid;gap:10px}
.logform h2{font-size:20px}
.field{display:grid;gap:4px;min-width:0}
.field label{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.field input{width:100%;min-width:0;font:inherit;font-size:16px;padding:9px 10px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.lf-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end}
.bw{display:flex;gap:8px;align-items:center;font-weight:600;font-size:15px;line-height:1.15;padding-bottom:8px}
.bw span{font-weight:400;font-size:12.5px;color:var(--muted)}
.bw input{width:20px;height:20px;accent-color:var(--accent)}
.primary{font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.05em;text-transform:uppercase;border:0;border-radius:10px;padding:11px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.lf-msg{font-size:14px;color:var(--muted);min-height:1.2em}
.lf-msg.err{color:#C0392B}
.ghost{font:inherit;font-size:14px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 12px;border-radius:9px;cursor:pointer}
.lift-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;padding:0;color:inherit;font:inherit;cursor:pointer}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.seg .chip{font-size:13px;padding:4px 10px}
.big{display:flex;align-items:baseline;gap:10px;margin-top:12px;flex-wrap:wrap}
.big b{font-family:var(--display);font-size:32px;line-height:1;font-variant-numeric:tabular-nums}
.delta{font-size:14px;font-weight:600}
.up{color:#2E8B57}.down{color:#C0392B}
.chart{width:100%;height:auto;display:block;margin-top:8px}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:var(--accent);opacity:.14}
.chart .pt{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.chart .pt.last{fill:var(--accent)}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--body)}
.sess{margin-top:12px;display:grid}
.sess>div{padding:9px 0;border-top:1px solid var(--line)}
.sess .d{font-size:13px;font-weight:600;color:var(--muted)}
.sets{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
.set{display:inline-flex;align-items:center;gap:6px;background:var(--chip);border-radius:7px;padding:3px 4px 3px 9px;font-size:14px;font-variant-numeric:tabular-nums}
.set button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:13px;padding:2px 6px;border-radius:5px;cursor:pointer}
.set button[data-armed]{background:#C0392B;color:#fff}
.backup{display:grid;gap:10px}
.bwcard{display:grid;gap:10px}
.bwrow{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}
.bwrow .ghost{padding:9px 12px}
.rank{margin-top:12px;padding:12px;border-radius:10px;background:var(--bg);border:1px solid var(--line);display:grid;gap:8px}
.rank-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.tier{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:6px;background:var(--accent);color:var(--accent-ink)}
.tier.sm{font-size:12px;padding:1px 6px;margin-left:6px;vertical-align:2px}
.bar{height:8px;border-radius:99px;background:var(--chip);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.ladder{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;font-size:11.5px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.ladder span.on{color:var(--ink);font-weight:700}
.backup p{margin:0;font-size:14px;color:var(--muted)}
.backup .row{display:flex;gap:8px;flex-wrap:wrap}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .up{color:#5CC98A}:root:not([data-theme="light"]) .down,:root:not([data-theme="light"]) .lf-msg.err{color:#F0857A}}
:root[data-theme="dark"] .up{color:#5CC98A}:root[data-theme="dark"] .down,:root[data-theme="dark"] .lf-msg.err{color:#F0857A}
.sessbox{display:grid;gap:10px;margin-top:12px}
.sesscard{display:grid;gap:0}
.timer{font-family:var(--display);font-weight:700;font-size:22px;font-variant-numeric:tabular-nums}
.live{display:inline-block;font-family:var(--body);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:#C0392B;color:#fff;border-radius:5px;padding:2px 6px;vertical-align:4px;margin-left:6px}
.sx{border-top:1px solid var(--line);padding-top:12px;margin-top:12px;display:grid;gap:8px;min-width:0}
.sx-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sx-h b{font-family:var(--display);font-size:20px;line-height:1.1;min-width:0}
.sx-tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.sx-tools select{font:inherit;font-size:13px;padding:3px 6px;border-radius:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.sx-tools label{display:inline-flex;gap:5px;align-items:center}
.sx-tools input{width:16px;height:16px;accent-color:var(--accent)}
.linkbtn{border:0;background:none;color:var(--muted);font:inherit;font-size:13px;text-decoration:underline;padding:0;cursor:pointer}
.linkbtn[data-armed]{color:#C0392B;font-weight:600}
.hint{font-size:13px;color:var(--muted)}
.addrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:8px}
.addrow input,.plain{width:100%;min-width:0;font:inherit;font-size:16px;padding:8px 10px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.addrow input:disabled{opacity:.55}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.addex{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;min-width:0}
.stat b{display:block;font-family:var(--display);font-size:26px;line-height:1.05;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted)}
.bp{display:grid;gap:10px;margin-top:4px}
.bp-r{display:grid;gap:4px}
.bp-t{display:flex;justify-content:space-between;gap:8px;font-size:14px;font-variant-numeric:tabular-nums}
.bp-t b{font-weight:600}
.planchips{display:flex;flex-wrap:wrap;gap:6px}
.planchips .chip{white-space:normal;text-align:left}
.brow{display:grid;grid-template-columns:minmax(0,1fr) 56px 76px auto;gap:6px;align-items:center}
.brow input{width:100%;min-width:0;font:inherit;font-size:16px;padding:7px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.startbtn{margin-top:12px;width:100%}
.ctag{font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-left:6px}
.subtabs{display:grid;width:max-content;max-width:100%;grid-auto-flow:column;gap:3px;background:var(--chip);border-radius:9px;padding:3px;margin-top:12px}
.subtabs button{font:inherit;font-size:14px;font-weight:600;border:0;background:transparent;color:var(--muted);padding:5px 12px;border-radius:7px;cursor:pointer}
.subtabs button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.closed{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.closed b{font-family:var(--display);font-size:18px}
.closed .hint{margin-top:2px}
.cf{display:grid;gap:10px}
.cf3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cf select,.cf textarea{width:100%;min-width:0;font:inherit;font-size:16px;padding:8px 10px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.cf textarea{min-height:64px;resize:vertical}
.crow{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}
.crow .x{font-weight:600}
.cnote{font-size:13.5px;color:var(--muted);margin-top:3px;white-space:pre-wrap}
.qa{display:grid;gap:8px;margin-top:4px}
.qrow{display:grid;gap:2px;padding:8px 0;border-top:1px solid var(--line)}
.qrow:first-child{border-top:0}
.qtop{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.qtop b{font-weight:600}
.pill{font-size:12px;font-weight:700;border-radius:999px;padding:2px 8px;white-space:nowrap;background:var(--chip);color:var(--ink)}
.pill.good{background:#2E8B57;color:#fff}.pill.bad{background:#C0392B;color:#fff}.pill.best{background:var(--accent);color:var(--accent-ink)}
.cmp{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;font-size:14px;font-variant-numeric:tabular-nums;margin-top:4px}
.cmp span:nth-child(3n+1){color:var(--muted)}
.cmp span:nth-child(3n){text-align:right;font-weight:600}
.ideas{margin:4px 0 0;padding-left:20px;display:grid;gap:6px}
.ideas li::marker{color:var(--accent)}
.liftsub{margin-top:12px;width:100%!important;grid-template-columns:1fr 1fr}
.liftsub button{font-family:var(--display);font-size:16px;letter-spacing:.04em;text-transform:uppercase;padding:7px}
.chip{min-height:34px}
.linkbtn{padding:6px 0}
.set button{min-width:30px;min-height:30px}
.setb{font:inherit;font-size:14.5px;font-variant-numeric:tabular-nums;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:8px;padding:6px 10px;min-height:38px;cursor:pointer}
.setb.wu{background:transparent;color:var(--muted);border-style:dashed}
.setb.on{outline:2px solid var(--accent);outline-offset:1px}
.setb .k{font-weight:700;margin-right:4px;color:var(--accent)}
.setb.wu .k{color:var(--muted)}
.set.wu{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.edrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 70px;gap:8px;align-items:end;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px}
.edrow .acts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.addrow.r4{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 64px auto}
.addrow select,.edrow select{width:100%;min-width:0;font:inherit;font-size:16px;padding:8px 4px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.restbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--ink);color:var(--bg);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-shadow:0 -4px 16px rgba(0,0,0,.2)}
.restbar .hint{color:inherit;opacity:.7;display:block}
.restbar b{font-family:var(--display);font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.restbar.done{background:var(--accent);color:var(--accent-ink)}
.rb-l{min-width:0}
.rb-l .hint{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}
.rb-b{display:flex;gap:6px}
.rb-b button{font:inherit;font-size:14px;font-weight:600;border:1px solid currentColor;background:transparent;color:inherit;border-radius:9px;padding:8px 10px;min-height:40px;cursor:pointer}
body.resting .wrap{padding-bottom:96px}
.banner{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--accent-soft);border:1px solid var(--accent);border-radius:12px;padding:12px}
.banner b{display:block}
.wk{display:grid;gap:9px;margin-top:8px}
.wk-r{display:grid;gap:4px}
.wk-bar{position:relative;height:10px;border-radius:99px;background:var(--chip);overflow:hidden}
.wk-bar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--muted)}
.wk-bar i.ok{background:var(--accent)}
.wk-bar u{position:absolute;top:0;bottom:0;width:2px;background:var(--surface);opacity:.9}
.cal{display:grid;grid-template-columns:auto repeat(7,minmax(0,1fr));gap:4px;align-items:center;margin-top:8px;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.cal i{display:block;height:16px;border-radius:4px;background:var(--chip)}
.cal i.l{background:var(--accent)}
.cal i.c{background:#3A8FB7}
.cal i.lc{background:linear-gradient(135deg,var(--accent) 50%,#3A8FB7 50%)}
.cal i.f{opacity:.35}
.zone{font-size:11.5px;font-weight:700;border-radius:999px;padding:1px 7px;background:var(--chip);color:var(--ink);margin-left:6px}
mark{background:var(--accent-soft);color:inherit;border-radius:3px}
@media (prefers-reduced-motion:reduce){.chev{transition:none}}
</style>

</head><body>
<div id="ptr" class="ptr" aria-hidden="true"><span class="ptr-i">↓</span><span id="ptr-t">Pull to refresh</span></div>
<div id="restbar" class="restbar" hidden><div class="rb-l"><span class="hint" id="rb-ex">Rest</span><b id="rb-t">2:00</b></div><div class="rb-b"><button data-rb="-15">−15s</button><button data-rb="15">+15s</button><button data-rb="skip">Skip</button></div></div>
<div class="wrap">
  <header>
    <div class="top"><h1>Gym Tracker <small id="sub"></small></h1><button id="refresh" class="refresh" aria-label="Refresh">↻</button></div>
    <input id="q" type="search" placeholder="Search" autocomplete="off" aria-label="Search">
    <div class="tabs" role="tablist">
      <button role="tab" id="t-workouts" data-tab="workouts">Workouts</button>
      <button role="tab" id="t-exercises" data-tab="exercises">Exercises</button>
      <button role="tab" id="t-lifts" data-tab="lifts">Lifts</button>
      <button role="tab" id="t-cardio" data-tab="cardio">Cardio</button>
    </div>
  </header>
  <div id="liftsub" class="subtabs liftsub" role="tablist" hidden><button data-v="train" id="ls-train">Train</button><button data-v="progress" id="ls-progress">Progress</button></div>
  <div id="sessbox" class="sessbox" hidden></div>
  <datalist id="ex-list"></datalist>
  <section id="logform" class="card logform" hidden>
    <h2>Quick log</h2>
    <p class="hint" style="margin:-6px 0 0">One set at a time, without starting a workout.</p>
    <div class="field"><label for="lf-ex">Exercise</label><input id="lf-ex" list="lf-list" placeholder="e.g. Bench Press" autocomplete="off"><datalist id="lf-list"></datalist></div>
    <div class="lf-grid">
      <div class="field"><label for="lf-kg">Weight (kg)</label><input id="lf-kg" type="number" inputmode="decimal" step="0.5" min="0" placeholder="60"></div>
      <div class="field"><label for="lf-reps">Reps</label><input id="lf-reps" type="number" inputmode="numeric" step="1" min="1" placeholder="8"></div>
    </div>
    <div class="lf-grid">
      <div class="field"><label for="lf-date">Date</label><input id="lf-date" type="date"></div>
      <label class="bw" for="lf-bw"><input id="lf-bw" type="checkbox"> Bodyweight<br><span>reps only</span></label>
    </div>
    <button id="lf-add" class="primary">Add set</button>
    <div id="lf-msg" class="lf-msg" role="status"></div>
  </section>
  <div id="filters" class="filters"></div>
  <div id="count" class="count"></div>
  <main id="list" class="list"></main>
</div>

<script>
const FRIENDS = true;
const localStorage = (() => { const P = "fr:"; const L = () => window.localStorage;
  return { getItem: k => L().getItem(P + k), setItem: (k, v) => L().setItem(P + k, v), removeItem: k => L().removeItem(P + k) }; })();
const DATA = (() => { const r = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch(e) { return d; } };
  const ex = r("gl-lib-ex", []), cu = r("gl-lib-cues", {});
  return { exercises: Array.isArray(ex) ? ex : [], workouts: [], coaching: cu && typeof cu === "object" ? cu : {} }; })();
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch(e){} } };
let tab = (["workouts","exercises","lifts","cardio"].includes(location.hash.slice(1)) && location.hash.slice(1)) || store.get("tab") || "workouts";
if (tab === "coaching" || location.hash === "#coaching") tab = "exercises";
if (!["workouts","exercises","lifts","cardio"].includes(tab)) tab = "workouts";
let filter = "All";
const q = $("#q");
const split = s => s ? s.split(",").map(x => x.trim()).filter(Boolean) : [];
const match = (txt) => { const t = q.value.trim().toLowerCase(); return !t || txt.toLowerCase().includes(t); };

$("#sub").textContent = `${DATA.workouts.length + (JSON.parse((() => { try { return localStorage.getItem("gl-plans-v1"); } catch(e) { return null; } })() || "[]").length || 0)} workouts · ${DATA.exercises.length} exercises`;

function setTab(t){ tab = t; filter = "All"; store.set("tab", t); render(); }
document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => setTab(b.dataset.tab)));
q.addEventListener("input", render);

function chips(opts){
  $("#filters").innerHTML = ["All", ...opts].map(o => `<button class="chip" aria-pressed="${o===filter}" data-f="${esc(o)}">${esc(o)}</button>`).join("");
  $("#filters").querySelectorAll(".chip").forEach(c => c.addEventListener("click", () => { filter = c.dataset.f; render(); }));
}

function rx(sets, reps){
  return sets ? `<b>${esc(sets)}</b><span>× ${esc(reps)}</span>` : `<span>${esc(reps)}</span>`;
}

function renderWorkouts(){
  const W = DATA.workouts.concat(plans.map(p => ({id:p.id, name:p.name, primary:"Custom", secondary:"", custom:true, items:p.items.map((x, k) => ({n:k+1, ex:x.ex, sets:x.sets, reps:x.reps}))})));
  const cats = [...new Set(W.flatMap(w => [w.primary, ...split(w.secondary)]))];
  chips(cats);
  const ws = W.filter(w => (filter==="All" || w.primary===filter || split(w.secondary).includes(filter))
    && match([w.id,w.name,w.primary,w.secondary,...w.items.map(i=>i.ex)].join(" ")));
  $("#count").textContent = `${ws.length} workout${ws.length===1?"":"s"}`;
  const top = FRIENDS ? `<section class="card" style="display:grid;gap:8px"><button class="primary" data-act="wnew">+ Create a workout</button><div class="hint">${W.length ? "Tap a workout to see it, start it, or edit it." : "Build a workout from your own exercises, then start it from here or the Lifts tab. You can also start an empty workout on Lifts and save it as a workout at the end."}</div></section>` : "";
  if (FRIENDS && !W.length) { $("#filters").innerHTML = ""; $("#count").textContent = ""; return top; }
  return top + ws.map(w => `<details class="card" data-key="w:${esc(w.id)}" ${ws.length===1 || openCards.has("w:" + w.id) ? "open" : ""}>
    <summary><div class="wh"><div><span class="wid">${esc(w.id)}</span><h2 style="margin-top:6px">${esc(w.name)}</h2>
      <div class="meta">${esc(w.primary)}${w.secondary?` · ${esc(w.secondary)}`:""} · ${w.items.length} exercises</div></div><span class="chev" aria-hidden="true">›</span></div></summary>
    <ol class="steps">${w.items.map(i => `<li><span class="n">${i.n}</span><span class="x">${esc(i.ex)}</span><span class="r">${i.sets?`<b>${esc(i.sets)}</b> × `:""}${esc(i.reps)}</span></li>`).join("")}</ol>
    ${cueFor(w.name) ? `<details class="sec" style="margin-top:12px"><summary class="linkbtn" style="display:inline">Guidelines</summary>${cuesHTML(cueFor(w.name))}</details>` : ""}
    <button class="primary startbtn" data-act="start" data-pid="${esc(w.id)}">${active ? "Workout in progress" : "Start this workout"}</button>
    ${w.custom ? `<div style="display:flex;gap:16px;margin-top:10px"><button class="linkbtn" data-act="bedit" data-pid="${esc(w.id)}">Edit plan</button><button class="linkbtn" data-act="pdel" data-pid="${esc(w.id)}">Delete plan</button></div>` : ""}
  </details>`).join("");
}

let exSub = {}, openCards = new Set((() => { try { return JSON.parse(localStorage.getItem("gl-open") || "[]"); } catch(e) { return []; } })());
const cueFor = name => { const k = Object.keys(DATA.coaching).find(m => m.toLowerCase() === String(name).toLowerCase()); return k ? DATA.coaching[k] : null; };
function cuesHTML(c, qm){
  return Object.entries(c).map(([s, cues]) => {
    const cs = cues.filter(x => !qm || qm(s + " " + x));
    return cs.length ? `<div class="sec"><h3>${esc(s.replace(/^\d+\.\s*/,""))}</h3><ul class="cues">${cs.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>` : "";
  }).join("");
}
function renderExercises(){
  const wnames = new Set(DATA.workouts.map(w => w.name.toLowerCase()));
  const extra = Object.keys(DATA.coaching).filter(m => !libEx(m) && !wnames.has(m.toLowerCase()))
    .map(m => ({name:m, body:"", secondary:"", tags:"", sets:"", reps:"", equipment:"", notes:"", workout:"", only:true}));
  const all = DATA.exercises.concat(extra);
  chips(["Has coaching"].concat(["Legs","Glutes","Calves","Core","Chest","Back","Shoulders","Arms","Full Body"].filter(b => DATA.exercises.some(e => e.body===b)))
    .concat([...new Set(DATA.exercises.flatMap(e => split(e.tags)))].sort()));
  const es = all.filter(e => {
    const c = cueFor(e.name);
    if (filter === "Has coaching" ? !c : (filter !== "All" && e.body !== filter && !split(e.tags).includes(filter))) return false;
    return match(Object.values(e).join(" ") + " " + (c ? JSON.stringify(c) : ""));
  });
  $("#count").textContent = `${es.length} exercise${es.length===1?"":"s"}`;
  return es.map(e => {
    const c = cueFor(e.name), sub = e.only ? "coaching" : (exSub[e.name] || "details"), key = "ex:" + e.name;
    const details = `<div class="rx">${rx(e.sets, e.reps)}</div>
      <div class="tags">${split(e.tags).map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>
      ${e.equipment?`<div class="note"><strong>Equipment:</strong> ${esc(e.equipment)}</div>`:""}
      ${e.notes?`<div class="note">${esc(e.notes)}</div>`:""}`;
    return `<details class="card" data-key="${esc(key)}" ${openCards.has(key) || es.length === 1 ? "open" : ""}>
      <summary><div class="wh"><div style="min-width:0"><h2>${esc(e.name)}</h2>
        <div class="meta">${e.only ? "Coaching cues" : esc(e.body) + (e.secondary ? " · " + esc(e.secondary) : "")}${c && !e.only ? " · Coaching" : ""}</div></div>
        <div style="display:flex;gap:8px;align-items:center">${e.workout ? `<span class="wid">${esc(e.workout)}</span>` : ""}<span class="chev" aria-hidden="true">›</span></div></div></summary>
      ${(c || FRIENDS) && !e.only ? `<div class="subtabs" role="tablist"><button data-act="exsub" data-ex="${esc(e.name)}" data-v="details" aria-pressed="${sub==="details"}">Details</button><button data-act="exsub" data-ex="${esc(e.name)}" data-v="coaching" aria-pressed="${sub==="coaching"}">Coaching cues</button></div>` : ""}
      ${sub === "coaching" ? (c ? cuesHTML(c) : FRIENDS ? `<div class="note">No coaching cues yet.</div>` : "") + (FRIENDS ? cueEditor(e.name) : "") : details + (FRIENDS ? `<div style="display:flex;gap:16px;margin-top:12px"><button class="linkbtn" data-act="exedit" data-ex="${esc(e.name)}">Edit exercise</button><button class="linkbtn" data-act="exdel" data-ex="${esc(e.name)}">Delete</button></div>` : "")}
    </details>`;
  }).join("");
}
$("#list").addEventListener("toggle", e => {
  const d = e.target; if (!d.matches || !d.matches("details[data-key]")) return;
  d.open ? openCards.add(d.dataset.key) : openCards.delete(d.dataset.key);
  try { localStorage.setItem("gl-open", JSON.stringify([...openCards])); } catch(err) {}
}, true);
$("#list").addEventListener("click", e => {
  const b = e.target.closest("[data-act=exsub]"); if (!b) return;
  e.preventDefault(); exSub[b.dataset.ex] = b.dataset.v; render();
});

/* ---------- Lifts: logging + progress ---------- */
async function doExport(){
  const name = FRIENDS ? `gym-tracker-${iso(new Date())}.json` : `gym-tracker-${iso(new Date())}.json`;
  const blob = new Blob([JSON.stringify({app:"gym-library", version:4, exported:new Date().toISOString(), log, bodyweight:bwlog, sessions:wsess, plans, exmap, cardio:clog, perhand:phmap, restmap, lib: FRIENDS ? {exercises: DATA.exercises, coaching: DATA.coaching} : undefined}, null, 1)], {type:"application/json"});
  let done = false;
  try { const f = new File([blob], name, {type:"application/json"}); if (navigator.canShare?.({files:[f]})) { await navigator.share({files:[f], title:name}); done = true; } } catch(err) { if (err?.name === "AbortError") return; }
  if (!done) { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000); }
  store.set("lastExport", iso(new Date())); render(); setTimeout(() => { const m = document.getElementById("bk-msg"); if (m) m.textContent = `Exported ${log.length} sets.`; }, 0);
}
function backupBanner(){
  const has = log.length || (typeof wsess !== "undefined" && wsess.length) || (typeof clog !== "undefined" && clog.length) || bwlog.length;
  if (!has) return "";
  const last = store.get("lastExport"), days = last ? Math.floor((Date.now() - new Date(last + "T00:00").getTime()) / 864e5) : null;
  if (days !== null && days < 7) return "";
  return `<section class="banner"><div><b>${days === null ? "No backup yet" : `Last backup ${days} days ago`}</b><span class="hint">Your history lives only on this phone.</span></div><button class="ghost" data-act="export">Back up now</button></section>`;
}
const LKEY = "gl-log-v1";
let log = []; try { log = JSON.parse(localStorage.getItem(LKEY) || "[]"); if (!Array.isArray(log)) log = []; } catch(e) { log = []; }
const saveLog = () => { try { localStorage.setItem(LKEY, JSON.stringify(log)); return true; } catch(e) { return false; } };
try { navigator.storage?.persist?.(); } catch(e) {}
const iso = d => d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
const fmtD = (d, y) => new Date(d + "T00:00").toLocaleDateString("en-AU", y ? {day:"numeric", month:"short", year:"numeric"} : {day:"numeric", month:"short"});
const num = n => (Math.round(n * 10) / 10).toLocaleString("en-AU");
let openEx = store.get("openEx"), range = store.get("range") || "12w", metricSel = {}, renameEx = null;
const RANGES = {"4w":28, "12w":84, "1y":365, "all":null};
const RLABEL = {"4w":"4 weeks", "12w":"12 weeks", "1y":"1 year", "all":"all time"};
const METRICS = {
  top:   {label:"Top set", unit:"kg",   f:s => Math.max(...s.sets.map(x => x.kg))},
  e1rm:  {label:"Est. 1RM", unit:"kg",  f:s => Math.max(...s.sets.map(x => x.reps === 1 ? x.kg : x.kg * (1 + x.reps / 30)))},
  vol:   {label:"Volume", unit:"kg",    f:s => working(s.sets).reduce((a, x) => a + x.kg * x.reps * (x.ph ? 2 : 1), 0)},
  best:  {label:"Best set", unit:"reps", f:s => Math.max(...s.sets.map(x => x.reps))},
  total: {label:"Total reps", unit:"reps", f:s => working(s.sets).reduce((a, x) => a + x.reps, 0)}
};
/* Bodyweight log + strength tiers (male, estimated 1RM ÷ bodyweight; approximate) */
const BKEY = "gl-bw-v1";
let bwlog = []; try { bwlog = JSON.parse(localStorage.getItem(BKEY) || "[]"); if (!Array.isArray(bwlog)) bwlog = []; } catch(e) { bwlog = []; }
const saveBW = () => { try { localStorage.setItem(BKEY, JSON.stringify(bwlog)); return true; } catch(e) { return false; } };
const bwSorted = () => bwlog.slice().sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
function bwAt(d){ const s = bwSorted(); if (!s.length) return null; let v = null; for (const x of s) { if (x.date <= d) v = x.kg; else break; } return v ?? s[0].kg; }
const TIERS = ["Beginner","Novice","Intermediate","Advanced","Elite"];
const STANDARDS = [
  {key:"Bench press",    cut:[0.5, 0.75, 1.25, 1.75, 2.0],  f:[0.25, 0.5, 0.75, 1.0, 1.5],  test:n => /\bbench\b/i.test(n) && !/incline|decline|dumbbell|\bdb\b|close/i.test(n)},
  {key:"Squat",          cut:[0.75, 1.25, 1.5, 2.25, 2.75], f:[0.5, 0.75, 1.25, 1.5, 2.0], test:n => /\bsquats?\b/i.test(n) && !/split|jump|front|goblet|bulgarian|pistol|hack|box/i.test(n)},
  {key:"Deadlift",       cut:[1.0, 1.5, 2.0, 2.5, 3.0],     f:[0.5, 1.0, 1.25, 1.75, 2.5],     test:n => /deadlift/i.test(n) && !/romanian|rdl|stiff|single/i.test(n)},
  {key:"Overhead press", cut:[0.35, 0.55, 0.8, 1.05, 1.35], f:[0.2, 0.35, 0.5, 0.75, 1.0], test:n => /overhead press|\bohp\b|military press|shoulder press/i.test(n) && !/dumbbell|\bdb\b/i.test(n)}
];
const stdFor = ex => STANDARDS.find(s => s.test(ex)) || null;
const e1 = x => x.reps === 1 ? x.kg : x.kg * (1 + x.reps / 30);
/* Warm-ups: lighter sets (under 80% of the day's top weight) logged before the first set near the top weight (90%+).
   A set's own wu flag (set by tapping it) always wins. */
function wuFlags(sets){
  const w = sets.filter(x => !x.bw && x.kg > 0), top = w.length ? Math.max(...w.map(x => x.kg)) : 0;
  let reached = false;
  return sets.map(x => {
    if (!x.bw && x.kg >= top * 0.9) reached = true;
    if (typeof x.wu === "boolean") return x.wu;
    if (x.bw || !(x.kg > 0) || !top) return false;
    return !reached && x.kg < top * 0.8;
  });
}
const working = sets => { const f = wuFlags(sets); return sets.filter((x, i) => !f[i]); };
const rirTxt = x => x.rir == null || x.rir === "" ? "" : ` R${x.rir >= 4 ? "4+" : x.rir}`;
const SEX = () => FRIENDS && store.get("gl-sex") === "F" ? "F" : "M";
function rankOf(ex){
  const st = stdFor(ex); if (!st || isBW(ex)) return null;
  const ss = sessions(ex); if (!ss.length) return null;
  const last = ss[ss.length-1], bw = bwAt(last.d); if (!bw) return {st, need:"bw"};
  const best = Math.max(...last.sets.map(e1)), ratio = best / bw;
  const cut = SEX() === "F" ? st.f : st.cut;
  let t = -1; cut.forEach((c, i) => { if (ratio >= c) t = i; });
  const next = t < 4 ? cut[t+1] : null, prev = t >= 0 ? cut[t] : 0;
  return {cut, st, ratio, best, bw, tier: t >= 0 ? TIERS[t] : "Untrained", t, next, pct: next ? Math.max(0, Math.min(1, (ratio - prev) / (next - prev))) : 1, toNext: next ? next * bw - best : 0};
}
METRICS.ratio = {label:"× Bodyweight", unit:"× BW", f:s => { const b = bwAt(s.d); return b ? Math.max(...s.sets.map(e1)) / b : NaN; }};

const exNames = () => [...new Set([...DATA.exercises.map(e => e.name), ...log.map(l => l.ex)])].sort((a,b) => a.localeCompare(b));
function sessions(ex){
  const m = {};
  log.filter(l => l.ex === ex).forEach(l => (m[l.date] = m[l.date] || []).push(l));
  return Object.keys(m).sort().map(d => ({d, sets:m[d]}));
}
const isBW = ex => { const l = log.filter(x => x.ex === ex); return l.length ? l[l.length-1].bw : false; };

const lf = id => document.getElementById(id);
lf("lf-date").value = iso(new Date());
function syncBW(){ lf("lf-kg").disabled = lf("lf-bw").checked; if (lf("lf-bw").checked) lf("lf-kg").value = ""; }
lf("lf-bw").addEventListener("change", syncBW);
lf("lf-ex").addEventListener("change", () => {
  const v = lf("lf-ex").value.trim(), hit = exNames().find(n => n.toLowerCase() === v.toLowerCase());
  if (hit) { lf("lf-ex").value = hit; if (log.some(l => l.ex === hit)) { lf("lf-bw").checked = isBW(hit); syncBW(); } }
});
function msg(t, err){ lf("lf-msg").textContent = t; lf("lf-msg").classList.toggle("err", !!err); }
lf("lf-add").addEventListener("click", () => {
  let ex = lf("lf-ex").value.trim();
  const bw = lf("lf-bw").checked, kg = parseFloat(lf("lf-kg").value), reps = parseInt(lf("lf-reps").value, 10), date = lf("lf-date").value || iso(new Date());
  if (!ex) return msg("Enter an exercise name.", true);
  if (!(reps >= 1)) return msg("Enter the number of reps (1 or more).", true);
  if (!bw && !(kg > 0)) return msg("Enter the weight in kg, or tick Bodyweight.", true);
  ex = exNames().find(n => n.toLowerCase() === ex.toLowerCase()) || (ex === ex.toLowerCase() ? ex.replace(/\b\w/g, c => c.toUpperCase()) : ex);
  log.push({id: Date.now().toString(36) + Math.random().toString(36).slice(2,6), ex, date, kg: bw ? null : kg, reps, bw});
  if (!saveLog()) { log.pop(); return msg("Couldn't save on this phone. Check storage isn't full or blocked.", true); }
  msg(`Added ${ex}: ${bw ? reps + " reps" : num(kg) + " kg × " + reps}`);
  openEx = ex; store.set("openEx", ex);
  if (!metricSel[ex]) metricSel[ex] = bw ? "best" : "e1rm";
  render();
});

function chartSVG(pts, unit, small, opt){
  opt = opt || {};
  const W = 340, H = small ? 96 : 170, L = 42, R = 14, T = 10, B = 22;
  if (!pts.length) return "";
  const xs = pts.map(p => new Date(p.d + "T00:00").getTime()), ys = pts.map(p => p.v);
  let y0 = Math.min(...ys), y1 = Math.max(...ys);
  if (y0 === y1) { y0 = y0 * 0.9; y1 = y1 * 1.1 || 1; } else { const pad = (y1 - y0) * 0.15; y0 -= pad; y1 += pad; }
  if (y0 < 0) y0 = 0;
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  const X = t => x1 === x0 ? (L + W - R) / 2 : L + (t - x0) / (x1 - x0) * (W - L - R);
  const Y = v => opt.invert ? T + (v - y0) / (y1 - y0) * (H - T - B) : T + (1 - (v - y0) / (y1 - y0)) * (H - T - B);
  const ticks = (small ? [0, 1] : [0, 0.5, 1]).map(f => y0 + f * (y1 - y0));
  const P = pts.map((p, i) => [X(xs[i]), Y(p.v)]);
  const line = P.map(p => p.map(n => n.toFixed(1)).join(",")).join(" ");
  const area = P.length > 1 && !opt.invert ? `<polygon class="ar" points="${P[0][0].toFixed(1)},${H-B} ${line} ${P[P.length-1][0].toFixed(1)},${H-B}"/>` : "";
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Progress chart">
    ${ticks.map(t => `<line class="grid" x1="${L}" x2="${W-R}" y1="${Y(t).toFixed(1)}" y2="${Y(t).toFixed(1)}"/><text x="${L-6}" y="${(Y(t)+4).toFixed(1)}" text-anchor="end">${opt.fmt ? opt.fmt(t) : small ? t.toFixed(1) : y1 - y0 < 5 ? t.toFixed(2) : Math.round(t)}</text>`).join("")}
    ${area}${P.length > 1 ? `<polyline class="ln" points="${line}"/>` : ""}
    ${P.map((p, i) => `<circle class="pt${i === P.length-1 ? " last" : ""}" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${i === P.length-1 ? 4.5 : 3.5}"/>`).join("")}

let swatch = setInterval(() => { const t = document.getElementById("stimer"); if (t && active) t.textContent = elapsed(Date.now() - active.start); }, 1000);

function sessClick(e){
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act, i = +b.dataset.i;
  const arm = (label) => { if (b.hasAttribute("data-armed")) return true; b.setAttribute("data-armed", ""); const o = b.textContent; b.textContent = label; setTimeout(() => { if (b.isConnected) { b.removeAttribute("data-armed"); b.textContent = o; } }, 3000); return false; };
  const smsg = t => { const m = document.getElementById("smsg"); if (m) { m.textContent = t; m.classList.add("err"); } };
  if (act === "start") startWorkout(b.dataset.pid);
  else if (act === "sset") {
    const it = active.items[i], kg = parseFloat(document.getElementById("sk-" + i).value), reps = parseInt(document.getElementById("sr-" + i).value, 10);
    if (!(reps >= 1)) return smsg(`Enter reps for ${it.ex}.`);
    if (!it.bw && !(kg > 0)) return smsg(`Enter kg for ${it.ex}, or tick Bodyweight.`);
    const now = Date.now();
    active.items.forEach((o, j) => { if (j !== i && o.sets.length && !o.closed) { if (o.seg) { o.acc = (o.acc || 0) + now - o.seg; o.seg = null; } o.closed = true; } });
    it.closed = false; if (!it.seg) it.seg = now;
    const rq = document.getElementById("sq-" + i).value;
    it.sets.push({kg: it.bw ? null : kg, reps, bw: it.bw, ph: !it.bw && !!it.ph, ts: now, ...(rq !== "" ? {rir: +rq} : {})});
    primeAudio(); keepAwake(true);
    const dur = restFor(it); active.rest = {ex: it.ex, dur, end: now + dur * 1000};
    active.edit = null; saveActive(); render(); tickRest();
  }
  else if (act === "sreopen") { active.items[i].closed = false; saveActive(); render(); setTimeout(() => document.getElementById("sr-" + i)?.scrollIntoView({block:"center"}), 0); }
  else if (act === "acopen") { active.cform = true; saveActive(); render(); }
  else if (act === "acancel") { active.cform = false; saveActive(); render(); }
  else if (act === "acsave") { const c = readCardio("ac"); if (!c) return; active.cardio = active.cardio || []; active.cardio.push(c); active.cform = false; saveActive(); render(); }
  else if (act === "acdel") { active.cardio.splice(+b.dataset.k, 1); saveActive(); render(); }
  else if (act === "copysum") {
    const rec = wsess.find(x => x.id === b.dataset.sid), txt = summaryText(rec), m = document.getElementById("copymsg");
    const fallback = () => { const t = document.getElementById("copybox"); t.hidden = false; t.value = txt; t.focus(); t.select(); m.textContent = "Select all and copy, then paste it into Claude."; };
    try { navigator.clipboard.writeText(txt).then(() => { m.textContent = "Copied. Paste it into Claude for a full review."; }, fallback); } catch(err) { fallback(); }
  }
  else if (act === "sdel") { active.items[i].sets.splice(+b.dataset.j, 1); active.edit = null; saveActive(); render(); }
  else if (act === "sedit") { const j = +b.dataset.j; active.edit = active.edit && active.edit.i === i && active.edit.j === j ? null : {i, j}; saveActive(); render(); }
  else if (act === "ecancel") { active.edit = null; saveActive(); render(); }
  else if (act === "esave") {
    const x = active.items[i].sets[active.edit.j], kg = parseFloat(document.getElementById("ek").value), reps = parseInt(document.getElementById("er").value, 10), rq = document.getElementById("erir").value;
    if (!(reps >= 1)) return smsg("Enter reps of 1 or more.");
    if (!x.bw) { if (!(kg > 0)) return smsg("Enter the weight in kg."); x.kg = kg; }
    x.reps = reps; if (rq === "") delete x.rir; else x.rir = +rq;
    const autoWu = wuFlags(active.items[i].sets.map(y => y === x ? {...y, wu: undefined} : y))[active.edit.j];
    const want = document.getElementById("ewu").checked; if (want === autoWu) delete x.wu; else x.wu = want;
    active.edit = null; saveActive(); render();
  }
  else if (act === "srm") { if (active.items[i].sets.length && !arm("Remove?")) return; active.items.splice(i, 1); saveActive(); render(); }
  else if (act === "sadd") {
    let ex = document.getElementById("sadd").value.trim(); if (!ex) return smsg("Type an exercise name to add.");
    ex = exNames().find(n => n.toLowerCase() === ex.toLowerCase()) || (ex === ex.toLowerCase() ? ex.replace(/\b\w/g, c => c.toUpperCase()) : ex);
    active.items.push(mkItem(ex)); saveActive(); render();
    setTimeout(() => document.getElementById("sr-" + (active.items.length - 1))?.scrollIntoView({block:"center"}), 0);
  }
  else if (act === "discard") { if (!arm("Tap again to discard")) return; active = null; saveActive(); keepAwake(false); render(); tickRest(); }
  else if (act === "export") { doExport(); }
  else if (act === "finish") { const err = finishWorkout(); if (err) return smsg(err); keepAwake(false); render(); tickRest(); scrollTo(0, 0); }
  else if (act === "closeview") { viewSid = null; render(); }
  else if (act === "view") { viewSid = b.dataset.sid; justDone = null; render(); scrollTo(0, 0); }
  else if (act === "delsess") {
    if (!arm("Tap again to delete")) return;
    const sid = b.dataset.sid; wsess = wsess.filter(x => x.id !== sid); log = log.filter(l => l.sid !== sid); clog = clog.filter(c => c.sid !== sid); wr(SKEY, wsess); wr(CKEY, clog); saveLog(); viewSid = null; render();
  }
  else if (act === "saveplan") {
    const rec = wsess.find(x => x.id === b.dataset.sid), name = document.getElementById("sp-name").value.trim();
    if (!name) { document.getElementById("sp-name").focus(); return; }
    plans.push({id: nextPlanId(), name, fromSid: rec.id, items: rec.items.map(it => ({ex: it.ex, sets: String(it.sets.length), reps: it.sets.every(x => x.reps === it.sets[0].reps) ? String(it.sets[0].reps) : `${Math.min(...it.sets.map(x => x.reps))}-${Math.max(...it.sets.map(x => x.reps))}`}))});
    rec.name = name; rec.wid = plans[plans.length-1].id; wr(SKEY, wsess);
    wr(PKEY, plans); render();
  }
  else if (act === "bnew") { builder = {id: null, name: "", items: [{ex:"", sets:"3", reps:"8-12"}]}; render(); }
  else if (act === "bedit") { const p = plans.find(x => x.id === b.dataset.pid); builder = {id: p.id, name: p.name, items: p.items.map(x => ({...x}))}; setTab("lifts"); scrollTo(0, 0); }
  else if (act === "bcancel") { builder = null; render(); }
  else if (act === "badd") { syncBuilder(); builder.items.push({ex:"", sets:"3", reps:"8-12"}); render(); }
  else if (act === "brm") { syncBuilder(); builder.items.splice(i, 1); render(); }
  else if (act === "bsave") {
    syncBuilder(); const items = builder.items.filter(x => x.ex);
    const m = document.getElementById("bmsg");
    if (!builder.name.trim()) { m.textContent = "Give the plan a name."; m.classList.add("err"); return; }
    if (!items.length) { m.textContent = "Add at least one exercise."; m.classList.add("err"); return; }
    items.forEach(x => { x.ex = exNames().find(n => n.toLowerCase() === x.ex.toLowerCase()) || x.ex; });
    if (builder.id) { const p = plans.find(x => x.id === builder.id); p.name = builder.name.trim(); p.items = items; }

  }

}
function sessChange(e){

      <div class="field"><label for="xf-sec">Other muscles</label><input id="xf-sec" class="plain" value="${esc(f.secondary)}" placeholder="e.g. Triceps, Shoulders"></div></div>
    <div class="lf-grid"><div class="field"><label for="xf-sets">Sets</label><input id="xf-sets" class="plain" value="${esc(f.sets)}" placeholder="3"></div><div class="field"><label for="xf-reps">Reps / time</label><input id="xf-reps" class="plain" value="${esc(f.reps)}" placeholder="8-12 reps"></div></div>
    <div class="field"><label>Tags</label><div class="planchips">${TAGLIST.map(t => `<button class="chip" data-act="xftag" data-v="${esc(t)}" aria-pressed="${tags.includes(t)}">${esc(t)}</button>`).join("")}</div></div>
    <div class="field"><label for="xf-eq">Equipment</label><input id="xf-eq" class="plain" value="${esc(f.equipment)}" placeholder="e.g. Barbell, bench"></div>
    <div class="field"><label for="xf-notes">Notes</label><textarea id="xf-notes" class="plain" style="min-height:60px">${esc(f.notes)}</textarea></div>
    <div id="xf-msg" class="lf-msg" role="status"></div>
    <button class="primary" data-act="exsave">Save exercise</button>
  </section>`;
}
function syncExForm(){
  if (!exForm) return; const v = id => document.getElementById(id);
  if (!v("xf-name")) return;
  exForm.name = v("xf-name").value; exForm.body = v("xf-body").value; exForm.secondary = v("xf-sec").value; exForm.sets = v("xf-sets").value;
  exForm.reps = v("xf-reps").value; exForm.equipment = v("xf-eq").value; exForm.notes = v("xf-notes").value;
}
function renderExercisesF(){
  const base = exForm ? exFormHTML() : `<section class="card" style="display:grid;gap:8px"><button class="primary" data-act="exnew">+ Add an exercise</button>
    <div class="hint">Exercises you use in a workout or plan are added here automatically. Open one to add details and coaching cues.</div></section>`;
  if (!DATA.exercises.length) { chips([]); $("#filters").innerHTML = ""; $("#count").textContent = ""; return base + (exForm ? "" : `<div class="card note">Your exercise library is empty. Add your first exercise, for example Bench Press, then add coaching cues to it.</div>`); }
  const list = renderExercises();
  return base + list;
}
function cueEditor(name){
  return `<div class="sec cf" style="margin-top:14px"><h3>Add cues</h3>
    <input id="cue-sec" class="plain" placeholder="Section, e.g. Setup or Common errors" list="cue-secs"><datalist id="cue-secs">${Object.keys(DATA.coaching[name] || {}).map(k => `<option value="${esc(k)}"></option>`).join("")}</datalist>
    <textarea id="cue-txt" placeholder="One cue per line"></textarea>
    <button class="ghost" style="justify-self:start" data-act="cueadd" data-ex="${esc(name)}">Add cues</button>
    ${DATA.coaching[name] ? `<div class="hint">Remove a section: ${Object.keys(DATA.coaching[name]).map(k => `<button class="linkbtn" data-act="cuedel" data-ex="${esc(name)}" data-v="${esc(k)}">${esc(k)}</button>`).join(" · ")}</div>` : ""}
  </div>`;
}
$("#list").addEventListener("click", e => {
  if (!FRIENDS) return;
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act;
  const arm = label => { if (b.hasAttribute("data-armed")) return true; b.setAttribute("data-armed", ""); const o = b.textContent; b.textContent = label; setTimeout(() => { if (b.isConnected) { b.removeAttribute("data-armed"); b.textContent = o; } }, 3000); return false; };
  if (act === "exnew") { exForm = {orig:null, name:"", body:"Chest", secondary:"", tags:"", sets:"", reps:"", equipment:"", notes:""}; render(); scrollTo(0, 0); }
  else if (act === "exedit") { const x = libEx(b.dataset.ex); exForm = {orig:x.name, ...x}; render(); scrollTo(0, 0); }
  else if (act === "excancel") { exForm = null; render(); }
  else if (act === "xftag") { syncExForm(); const t = split(exForm.tags), v = b.dataset.v; exForm.tags = (t.includes(v) ? t.filter(x => x !== v) : t.concat(v)).join(", "); render(); }
  else if (act === "exsave") {
    syncExForm(); const f = exForm, m = document.getElementById("xf-msg"), name = f.name.trim();
    if (!name) { m.textContent = "Give the exercise a name."; m.classList.add("err"); return; }
    const clash = libEx(name); if (clash && clash.name !== f.orig) { m.textContent = `${clash.name} is already in your library.`; m.classList.add("err"); return; }
    const rec = {name, body:f.body, secondary:f.secondary.trim(), tags:f.tags, sets:f.sets.trim(), reps:f.reps.trim(), equipment:f.equipment.trim(), notes:f.notes.trim(), workout:""};
    if (f.orig) { const k = DATA.exercises.findIndex(x => x.name === f.orig); DATA.exercises[k] = rec;
      if (f.orig !== name && DATA.coaching[f.orig]) { DATA.coaching[name] = DATA.coaching[f.orig]; delete DATA.coaching[f.orig]; } }
    else DATA.exercises.push(rec);
    exmap[name.toLowerCase()] = f.body; wr(MKEY, exmap);
    saveLib(); exForm = null; openCards.add("ex:" + name); render();
  }
  else if (act === "exdel") { if (!arm("Tap again to delete")) return; DATA.exercises = DATA.exercises.filter(x => x.name !== b.dataset.ex); DATA.exercises.length; delete DATA.coaching[b.dataset.ex]; saveLib(); render(); }
  else if (act === "cueadd") {
    const name = b.dataset.ex, sec = document.getElementById("cue-sec").value.trim() || "Cues", lines = document.getElementById("cue-txt").value.split("\n").map(x => x.trim()).filter(Boolean);
    if (!lines.length) { document.getElementById("cue-txt").focus(); return; }
    DATA.coaching[name] = DATA.coaching[name] || {}; (DATA.coaching[name][sec] = DATA.coaching[name][sec] || []).push(...lines);
    saveLib(); exSub[name] = "coaching"; render();
  }
  else if (act === "cuedel") { if (!arm("Tap again to remove")) return; delete DATA.coaching[b.dataset.ex][b.dataset.v]; if (!Object.keys(DATA.coaching[b.dataset.ex]).length) delete DATA.coaching[b.dataset.ex]; saveLib(); render(); }
  else if (act === "wnew") { builder = {id: null, name: "", items: [{ex:"", sets:"3", reps:"8-12"}]}; viewSid = null; setTab("lifts"); scrollTo(0, 0); }
});

let copen = store.get("copen") || null, cmetric = {};
function renderCardio(){
  chips([]); $("#filters").innerHTML = "";
  const wk = iso(new Date(Date.now() - 6 * 864e5));
  const week = CTYPES.map(t => { const xs = clog.filter(c => c.type === t.k && c.date >= wk); return xs.length ? `${t.label}: ${t.unit === "km" ? num(xs.reduce((a, c) => a + c.dist, 0)) + " km" : Math.round(xs.reduce((a, c) => a + c.dist, 0)).toLocaleString("en-AU") + " m"}` : ""; }).filter(Boolean);
  $("#count").textContent = clog.length ? `${clog.length} cardio session${clog.length === 1 ? "" : "s"} logged` : "";
  const form = `<section class="card"><h2>Log cardio</h2><div style="margin-top:10px">${cardioForm("cc", true)}</div><button class="primary" style="width:100%;margin-top:4px" data-act="ccsave">Save</button><div class="hint" style="margin-top:8px">Logging during a workout? Use + Add cardio inside the workout instead.</div></section>`;
  const zc = [0,0,0,0,0,0]; clog.filter(c => c.date >= iso(new Date(Date.now() - 27 * 864e5))).forEach(c => zc[zoneOf(c.hr)]++);
  const summary = `<section class="card"><h2 style="font-size:19px">Last 7 days</h2><div class="hint" style="margin-top:4px">${week.length ? week.join(" · ") : "No cardio in the last 7 days."}</div>
    <div class="sec"><h3>Heart-rate zones</h3>
    ${maxHR() ? `<div class="hint">Max HR ${maxHR()} bpm. Last 4 weeks by average HR: ${[1,2,3,4,5].map(z => `Z${z} ${zc[z]}`).join(" · ")}${zc[0] ? ` · no HR ${zc[0]}` : ""}</div><div class="hint">Zones come from each session's average HR, not time in each zone.</div>` : `<div class="hint">Add your max heart rate to see which zone each session sat in.</div>`}
    <div class="addex" style="margin-top:8px"><input id="maxhr" class="plain" type="number" inputmode="numeric" placeholder="Max HR, e.g. 190" value="${maxHR() || ""}"><button class="ghost" data-act="maxhr">Save</button></div>
    <div class="hint" style="margin-top:4px">Don't know it? Use 208 − 0.7 × your age as a starting estimate.</div></div></section>`;
  const cards = CTYPES.filter(t => clog.some(c => c.type === t.k)).map(t => {
    const xs = clog.filter(c => c.type === t.k).sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0), last = xs[xs.length-1];
    const best = xs.filter(c => isFinite(paceVal(c))).reduce((a, c) => !a ? c : (t.pace === "kmh" ? paceVal(c) > paceVal(a) : paceVal(c) < paceVal(a)) ? c : a, null);
    const open = copen === t.k;
    let body = "";
    if (open) {
      const m = cmetric[t.k] || "pace", cut = RANGES[range] ? iso(new Date(Date.now() - RANGES[range] * 864e5)) : "0000";
      const M = {pace:{l:"Pace", f:paceVal, fmt: v => t.pace === "kmh" ? num(v) : hms(v), inv: t.pace !== "kmh"}, dist:{l:"Distance", f:c => c.dist, fmt: v => t.unit === "km" ? v.toFixed(1) : Math.round(v)}, time:{l:"Time", f:c => c.secs, fmt: v => hms(v)}, hr:{l:"Avg HR", f:c => c.hr || NaN, fmt: v => Math.round(v)}};
      const pts = xs.filter(c => c.date >= cut).map(c => ({d:c.date, v:M[m].f(c)})).filter(p => isFinite(p.v));
      let delta = "";
      if (pts.length > 1) { const d = pts[pts.length-1].v - pts[0].v; if (m === "pace") { const better = M.pace.inv ? d < 0 : d > 0; delta = `<span class="delta ${Math.abs(d) < 0.5 ? "" : better ? "up" : "down"}">${t.pace === "kmh" ? (d >= 0 ? "+" : "") + num(d) + " km/h" : hms(Math.abs(d)) + (d < 0 ? " faster" : " slower")} over ${RLABEL[range]}</span>`; } }
      body = `<div class="seg">${Object.entries(M).map(([k, o]) => `<button class="chip" data-act="cmetric" data-t="${t.k}" data-v="${k}" aria-pressed="${k===m}">${o.l}</button>`).join("")}</div>
        <div class="seg">${Object.keys(RANGES).map(k => `<button class="chip" data-act="crange" data-v="${k}" aria-pressed="${k===range}">${k === "all" ? "All" : k.toUpperCase()}</button>`).join("")}</div>
        ${pts.length ? `<div class="big"><b>${M[m].fmt(pts[pts.length-1].v)}</b><span class="meta">${m === "pace" ? (t.pace === "kmh" ? "km/h" : t.pace === "km" ? "/km" : "/500 m") : m === "dist" ? t.unit : m === "hr" ? "bpm" : ""}</span>${delta}</div>${chartSVG(pts, "", false, {invert: M[m].inv, fmt: M[m].fmt})}${M[m].inv ? `<div class="hint">Higher on the chart = faster.</div>` : ""}` : `<div class="note">No ${M[m].l.toLowerCase()} data in the last ${RLABEL[range]}.</div>`}
        <div class="sess">${xs.slice().reverse().map(c => `<div><div class="qtop"><span class="d">${fmtD(c.date, true)}${c.sid ? " · in workout" : ""}</span><button class="linkbtn" data-act="cdel" data-id="${c.id}">Delete</button></div>
          <div style="font-variant-numeric:tabular-nums;margin-top:3px"><b>${distStr(c)}</b> · ${hms(c.secs)} · ${paceStr(c)}${c.hr ? ` · ${c.hr} bpm${zoneTag(c.hr)}` : ""}</div>${c.notes ? `<div class="cnote">${esc(c.notes)}</div>` : ""}</div>`).join("")}</div>`;
    }
    return `<article class="card"><button class="lift-h" data-act="copen" data-t="${t.k}" aria-expanded="${open}"><div style="min-width:0"><h2>${t.label}</h2>
      <div class="meta">${xs.length} session${xs.length===1?"":"s"} · last ${fmtD(last.date)}: ${distStr(last)} at ${paceStr(last)}${best ? ` · best ${paceStr(best)}` : ""}</div></div><span class="chev" style="transform:rotate(${open ? 90 : 0}deg)" aria-hidden="true">›</span></button>${body}</article>`;
  }).join("");
  return form + summary + (cards || `<div class="card note">Your cardio dashboard appears here once you log a session: a card per type with pace, distance, time and heart-rate charts.</div>`);
}
$("#list").addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b || tab !== "cardio") return;
  const act = b.dataset.act;
  if (act === "maxhr") { const v = parseInt(document.getElementById("maxhr").value, 10); if (v >= 120 && v <= 230) store.set("gl-maxhr", String(v)); else if (!v) store.set("gl-maxhr", ""); render(); return; }
  if (act === "ccsave") { const c = readCardio("cc"); if (!c) return; clog.push(c); if (!wr(CKEY, clog)) return; copen = c.type; store.set("copen", copen); render(); }
  else if (act === "copen") { copen = copen === b.dataset.t ? null : b.dataset.t; store.set("copen", copen || ""); render(); }
  else if (act === "cmetric") { cmetric[b.dataset.t] = b.dataset.v; render(); }
  else if (act === "crange") { range = b.dataset.v; store.set("range", range); render(); }
  else if (act === "cdel") {
    if (!b.hasAttribute("data-armed")) { b.setAttribute("data-armed", ""); b.textContent = "Tap again to delete"; setTimeout(() => { if (b.isConnected) { b.removeAttribute("data-armed"); b.textContent = "Delete"; } }, 3000); return; }
    clog = clog.filter(c => c.id !== b.dataset.id); wr(CKEY, clog); render();
  }
});
$("#list").addEventListener("click", e => { const b = e.target.closest("[data-act=sex]"); if (b) { store.set("gl-sex", b.dataset.v); render(); } });
$("#list").addEventListener("change", e => { if (tab === "cardio" && e.target.dataset && e.target.dataset.act === "ctype") sessChange(e); });

$("#liftsub").addEventListener("click", e => { const b = e.target.closest("button[data-v]"); if (!b) return; liftView = b.dataset.v; store.set("gl-liftview", liftView); filter = "All"; render(); scrollTo(0, 0); });
function render(){
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab===tab));
  if (FRIENDS) $("#sub").textContent = `${plans.length} workout${plans.length===1?"":"s"} · ${DATA.exercises.length} exercise${DATA.exercises.length===1?"":"s"}`;

  lf("logform").hidden = lv !== "train" || !!active || !!builder || !!viewSid;
  $("#sessbox").hidden = lv !== "train";
  $("#ex-list").innerHTML = exNames().map(n => `<option value="${esc(n)}"></option>`).join("");
  if (lv === "train") $("#sessbox").innerHTML = renderSess();
  const html = tab==="workouts" ? renderWorkouts() : tab==="exercises" ? (FRIENDS ? renderExercisesF() : renderExercises()) : tab==="lifts" ? renderLifts() : renderCardio();
  $("#list").innerHTML = html || (lv === "train" ? "" : `<div class="empty">Nothing matches. Clear the search or pick All.</div>`);
}
render();
async function doRefresh(){
  try { const r = await navigator.serviceWorker?.getRegistration(); await r?.update(); } catch(err) {}
  location.reload();
}
$("#refresh").addEventListener("click", e => { e.currentTarget.classList.add("spin"); doRefresh(); });

// Pull down from the top of the page to refresh
(() => {
  const el = $("#ptr"), txt = $("#ptr-t"), TH = 70;
  let sy = null, sx = 0, pull = 0, busy = false;
  const show = p => { el.style.transform = `translate(-50%, ${Math.min(p, 90) - 60}px)`; el.style.opacity = Math.min(1, p / 40); };
  addEventListener("touchstart", e => {
    if (busy || window.scrollY > 0 || e.touches.length > 1) { sy = null; return; }
    sy = e.touches[0].clientY; sx = e.touches[0].clientX; pull = 0; el.classList.remove("anim");
  }, { passive: true });
  addEventListener("touchmove", e => {
    if (sy === null) return;
    const dy = e.touches[0].clientY - sy, dx = Math.abs(e.touches[0].clientX - sx);
    if (dy <= 0 || dx > dy || window.scrollY > 0) { pull = 0; show(0); return; }
    pull = dy * 0.5; show(pull);
    const ready = pull >= TH; el.classList.toggle("ready", ready);
    txt.textContent = ready ? "Release to refresh" : "Pull to refresh";
  }, { passive: true });
  addEventListener("touchend", () => {
    if (sy === null) return; sy = null;
    el.classList.add("anim");
    if (pull >= TH) { busy = true; el.classList.remove("ready"); el.classList.add("busy"); txt.textContent = "Refreshing"; show(TH); doRefresh(); }
    else { show(0); el.classList.remove("ready"); }
    pull = 0;
  });
})();
